*{box-sizing:border-box}

header{padding:20px 16px 8px;max-width:1100px;margin:0 auto}

.sub{color:var(--muted);font-size:.85rem;margin:0}

.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px}
.tabs button{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:6px 12px;border-radius:6px;font:inherit;font-size:.85rem;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
input[type=search]{flex:1;min-width:200px;padding:9px 12px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);font:inherit}
label{font-size:.85rem;color:var(--muted);display:flex;gap:6px;align-items:center}
.count{font-size:.85rem;color:var(--muted)}
main{max-width:1100px;margin:0 auto;padding:0 16px 40px}
.wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:640px}
th,td{padding:8px 12px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
th{font-size:.8rem;color:var(--muted);font-weight:600;background:var(--bg)}
td.no{color:var(--muted);width:3.5em;font-variant-numeric:tabular-nums}
td.en{font-weight:600}
td.chk{width:4.5em;text-align:center}td.chk input{width:18px;height:18px}
td.star{color:var(--star);width:4em}
mark{background:var(--hl);color:inherit;border-radius:2px}
[hidden]{display:none!important}
button.more{display:block;margin:16px auto;padding:9px 20px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.empty{padding:32px;text-align:center;color:var(--muted)}
.tb{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:6px 12px;border-radius:6px;font:inherit;font-size:.85rem;cursor:pointer}
dialog{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:10px;max-width:520px;width:calc(100% - 32px);padding:20px}
dialog::backdrop{background:rgba(0,0,0,.45)}dialog h2{font-size:1.05rem;margin:0 0 6px}
textarea{width:100%;font:12px/1.4 ui-monospace,monospace;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:8px;word-break:break-all}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}

","The role of the court is to administer justice fairly and without bias.","裁判所の役割は、偏見なく公平に人々を裁く（司法を執り行う）ことである。","長文('26-1)"],["12","～の立場を取る、～の姿勢を示す","adopt a -- stance","The government adopted a cautious stance on the issue.","政府はその問題について慎重な姿勢を示した。",""],["13","反対の立場を取る","adopt an opposite position","He adopted an opposite position in the debate.","彼は討論で反対の立場を取った。",""],["14","Nを求めて世論をあおる、N（独立など）の運動をする","agitate for N","Labor unions have been agitating for higher wages and better working conditions.","労働組合は賃上げと労働条件の改善を求めて運動している。","長文('17-1)"],["15","口答えする","answer back","The student was punished for answering back to the teacher.","その生徒は先生に口答えをしたことで罰を受けた。",""],["16","〜のように見える、〜のようだ","appear to","He appears to be tired.","彼は疲れているように見える。",""],["17","（人が〜することを）ありがたく思う","appreciate one's doing","I appreciate you helping me with the project.","プロジェクトを手伝ってくれて感謝します。",""],["18","〜を確信している","are confident that","We are confident that our team will succeed.","私たちはチームが成功すると確信している。",""],["19","～の衰退を食い止める","arrest the decline in N(e.g. biodiversity)","Urgent conservation measures are needed to arrest the decline in biodiversity.","生物多様性の衰退を食い止めるには、緊急の保全対策が必要だ。","英作・二次用"],["20","災いを招く、自らトラブルの種をまく","ask for trouble","Leaving your bike unlocked is asking for trouble.","自転車に鍵をかけないのはトラブルを招くようなものです。","L('18-3)"],["21","会等に同化する、溶け込む","assimilate A into B","The government implemented policies to assimilate immigrants into mainstream society.","政府は移民を主流社会に同化させるための政策を実施した。","長文('17-1)"],["22","〜の責任を引き受ける","assume responsibility for","He assumed responsibility for the failure of the project.","彼はプロジェクトの失敗の責任を引き受けた。",""],["23","ほしいままに","at will","States must not resort to the use of force at will.","国家は自由気ままに武力を行使してはならない","英作・二次用"],["24","〜を償う","atone for","He tried to atone for his mistakes by working harder.","彼はより一生懸命働くことで自分の過ちを償おうとした。",""],["25","広く注目を集める","attract widespread attention","The discovery attracted widespread attention from scientists.","その発見は科学者たちの広い注目を集めた。",""],["26","〜のせい  in to buy a gift for the boss.","みんなでボスへのギフトを買うためにお金を出し合った。",""],["314","（涙などを）抑える、こらえる","choke back","She had to choke back her tears during the farewell speech.","彼女は送別のスピーチ中に涙をこらえなければならなかった。",""],["315","〜を遮る、止める","choke off","The manager choked off the conversation before it went too far.","マネージャーは会話が行き過ぎる前にそれを止めた。","語彙('25-3)"],["316","話しづらくなる、感情がこみ上げて言葉が詰まる","choke up","She choked up while giving her speech about her late father.","彼女は亡き父についてのスピーチをしているとき、感情がこみ上げて言葉を詰まらせた。",""],["317","（大量に）生産する、作り出す","churn out N","The factory churns out thousands of units every day.","その工場は毎日何千もの製品を生産している。","語彙('26-1)"],["318","Nの注目を集める","claim one's attention","The escalating refugee crisis quickly claimed the international community's attention.","拡大する難民危機は、たちまち国際社会の注目を集めた。",""],["319","犯行声明を出す","claim responsibility for the attack","The Islamic State group claimed responsibility for the attack on the convoy, which killed dozens of civilians and aid workers in the northern region on Thursday.","イスラム国グループは、木曜日に北部地域で数十人の民間人と救援活動家が死亡した車列への攻撃の犯行声明を出した。",""],["320","口をつぐむ、黙る","clam up","When asked about the incident, he just clammed up.","その出来事について尋ねられると、彼はただ黙り込んだ。","語彙('24-1),('25-1),(26-1)"],["321","〜を求めて騒ぐ、要求する","clamor for","The crowd clamored for an explanation from the officials.","群衆は役人から説明を求めて騒いだ。",""],["322","（～を）厳しく取り締まる、圧迫する","clamp down (on N)","The police decided to clamp down on illegal parking in the city center.","警察は中心街での違法駐車の取り締まりを強化することにした。","語彙('26-2)"],["323","Nと敵対する","clash with N","The rebel forces directly clashed with the government troops near the border.","反乱軍は国境付近で政府軍と直接敵対し、衝突した。","長文('25-1)"],["324","（失ったものを）取り戻す、回収する","claw back","The company is trying to claw back the market share it lost last year.","その会社は昨年失った市場シェアを取り戻そうとしている。",""],["325","片付ける、掃除する、（不正を）正す","clean up","They cleaned up the mess after the party.","彼らはパーティー後の散らかった部屋を片付けた。",""],["326","出世の階段を上る","climb up the ladder","She's worked hard to climb up the corporate ladder.","彼女は出世するために  of the meeting before anyone noticed.","彼は誰にも気づかれないうちに会議からこっそり抜け出した。","語彙('26-2)"],["460","～の時代に、～という時代に","during an age when ～","During an age when technology was rapidly evolving, people were optimistic about the future.","技術が急速に進化していた時代に、人々は未来に楽観的だった。",""],["461","ほこりを払う、久しぶりに使う","dust off","I dusted off my old guitar and started playing again.","古いギターのほこりを払って、再び弾き始めた。",""],["462","〜を長く考える、（過去のことなどを）引きずる","dwell on","You shouldn't dwell on your mistakes; learn from them and move on.","自分の間違いにこだわってはいけない、それらから学んで次に進みなさい。",""],["463","～を長々と考える、くどくどこだわる","dwell on N","There is no point in dwelling on past mistakes.","過去の過ちをくどくどこだわっていても意味がない。","語彙('25-2)"],["464","和らげる、緩和する","ease off","The pain gradually eased off after taking the medicine.","薬を飲んだ後、痛みは徐々に和らいだ。","語彙('26-1)"],["465","〜を穏やかに解雇する、退職させる","ease out","The company decided to ease him out of his position.","その会社は彼を穏やかにその地位から退かせることに決めた。",""],["466","緩める、優しくなる","ease up","The coach told the players to ease up on the practice sessions.","コーチは選手たちに練習を緩めるように言った。",""],["467","Nを削る、食いつぶす","eat into N","Rising fuel costs are eating into profits.","燃料費の高騰が利益を圧迫しています。","L('22-1)('19-1)"],["468","Nを節約する、切り詰める","economize on N","Some companies economize on employee training, only to face higher turnover later.","一部の企業は社員研修を節約するが、その結果として離職率の上昇に直面する。","L('25-1)"],["469","〜をわずかに上回る、ぎりぎりで勝つ","edge out","The team edged out their competitors to win the championship.","そのチームは競争相手をわずかに上回って、チャンピオンシップを制した。",""],["470","解決策を実現する","effect a solution","The team worked hard to effect a solution to the crisis.","チームは危機の解決に尽力した。",""],["471","変化をもたらす、改革する","effect change (in~)","The new CEO effected major changes in company policy.","新CEOは会社の方針に大きな変化をもたらした。",""],["472","免除を公式に実施する（implement~,grant~)","effect exemptions","The new policy will effect exemptions for small businesses under specific conditions.","新政策は、特定条件下において中小企業に免除を適用するものとなる。",""],["473","法律を施行する","effect legislation","The administration effected new environmental legisla ears of dealing with staff shortages and long hours.","多くの医療従事者は、人手不足と長時間労働が何年も続いた結果、燃え尽きたように感じている。","L('23-3)"],["515","失望した、がっかりした","feel let down","Many voters felt let down after the government failed to deliver on its campaign promises.","政府が公約を果たせなかったため、多くの有権者は期待を裏切られたと感じた。","L('25-1)"],["516","体調が悪い、気分が優れない、調子が悪い","feel out of sorts","I've been feeling a bit out of sorts lately.","最近、ちょっと調子が悪い。",""],["517","（会話などで）言葉を選ぶ、回避する","fence for","He started to fence for time when asked about the missing documents.","彼は失われた書類について尋ねられると時間稼ぎをし始めた。",""],["518","〜の世話をする、〜を養う","fend for","After the parents left, the children had to fend for themselves.","両親がいなくなった後、子供たちは自分たちで生活しなければならなかった。",""],["519","自分で生活する、自己防衛する","fend for oneself","You'll have to fend for yourself once you leave home.","家を出たら、自分で生活しなければならない。",""],["520","〜を撃退する、かわす","fend off","He managed to fend off the attacker until help arrived.","彼は助けが到着するまで攻撃者を撃退することができた。","語彙('25-1)"],["521","〜を探し出す、明らかにする","ferret out","The journalist ferreted out the truth behind the scandal.","そのジャーナリストはスキャンダルの背後にある真実を探し出した。",""],["522","〜について争う、対立する","feud about","The two families have been feuding about property for generations.","その二つの家族は何世代にもわたって財産について争っている。",""],["523","〜に影響する、〜に関与する","figure into","The cost of materials will figure into the total price of the project.","材料費はプロジェクトの総額に影響するだろう。",""],["524","刑事告訴をする、犯罪の告発を行う","file criminal charges","The victim decided to file criminal charges against the attacker.","被害者は攻撃者に対して刑事告訴をすることに決めた。",""],["525","（書類などに）記入する","fill out N","Please fill out this application form before the interview.","面接の前にこの申込書に記入してください。","L('18-3)/下位級"],["526","Nについて説明する、情報を提供する","fill 人 in on N","Can you fill me in on what happened at the meeting yesterday?","昨日の会議で何が起こったのか教えてくれる？",""],["527","Nの間で支持される[受け入れられる]","find favor in N","The new minimalist lifestyle has found favor in younger generations.","新しいミニマリスト的な生き方は、若い世代の間で支持されている。","長文('25-3)"],["528","（新しい環境などに）慣れる、自分の足でちゃんと歩めるようになる、一人立ちする" ong way to improving customer satisfaction.","より良いコミュニケーションは顧客満足度の向上に大いに役立つでしょう。","L('22-2)"],["641","〜に大きく貢献する、大いに役立つ","go a long way toward N","Better communication will go a long way toward preventing conflicts.","より良い意思疎通は対立の防止に大いに役立つ。","L('23-1)"],["642","（淡々と）こなす","go about","People are trying to go about their daily lives despite the heavy snow.","大雪にもかかわらず、人々はいつもの日常生活を送ろうとしている。",""],["643","N(生活)を淡々と送る","go about N","Despite the external chaos, the villagers tried to go about their daily lives.","外部の混乱にもかかわらず、村人たちは自分たちの日常生活を淡々と送ろうとした。","長文('25-3)"],["644","〜に逆らう、常識に反する","go against the grain","His decision to leave the company went against the grain of his colleagues.","彼が会社を辞める決定は、同僚たちの常識に反した。",""],["645","全力で〜する、全力を尽くす,=  go all out to do","go all out and do","They decided to go all out and win the championship.","彼らは優勝するために全力を尽くすことに決めた。",""],["646","vi:全力を投じる、全面的に参加する","go all-in","We decided to go all-in on the new marketing campaign.","私たちは新しいマーケティング戦略に全力を注ぐことにしました。","L('19-1)"],["647","〜に取り組む、攻撃する","go at","She went at the problem with determination.","彼女は決意を持ってその問題に取り組んだ。","語彙('24-3)"],["648","〜を裏切る、約束を破る","go back on","He went back on his promise to help me.","彼は私を助けるという約束を裏切った。",""],["649","ふりだし[始め]に戻る","go back to square one","The software failed, so we had to go back to square one.","ソフトウェアが動かなかったため、最初からやり直すことになりました。",""],["650","（提案などに）乗る、賛成する","go for it","If you believe your business idea has potential, go for it without letting fear hold you back.","自分のビジネスのアイデアに可能性があると思うなら、恐れずに挑戦しなさい。","L('24-2)"],["651","激しく全力でやる、ハードに取り組む（スラング）","go ham","They went ham during the final round of the competition.","彼らは競技の最終ラウンドで全力を尽くした。",""],["652","〜なんかどうでもいい、無視する（皮肉的な表現）","go jump in the lake","When he asked her to apologize, she told him to go jump in the lake.","彼が彼女に謝るように頼んだとき、彼女は「お前なんか無視してやる」と言った。",""],["653","激しく暴れる、暴走する","go on a rampage","The fans went on a rampage after their team lost the final.","彼らのチームが決勝戦で負けた後、ファンたちは暴走した。",""],["654","Nについて（長々と）話 pan out","Things didn't pan out as we had hoped.","物事は私たちが期待したようにはうまくいきませんでした。","L('20-3),語彙('24-1),('25-3)"],["910","（問題などを）隠す、見えなくする、うまく処理する","paper over","He tried to paper over the cracks in the relationship, but it didn't work.","彼は関係の問題を隠そうとしたが、うまくいかなかった。",""],["911","〜を分ける、配分する","parcel out","The manager decided to parcel out the tasks to different team members.","マネージャーは仕事を異なるチームメンバーに分けることに決めた。",""],["912","vi:別れる、たもとを分かつ","part ways","The two business partners decided to part ways after ten years.","その共同経営者2人は10年後に別々の道を歩むことにしました。","L('19-1)"],["913","〜を伝える、次世代に渡す","pass down","The tradition was passed down from generation to generation.","その伝統は世代から世代へと伝えられた。",""],["914","〜として通る、〜だと見なされる","pass for","He passed for a doctor because of his medical knowledge.","彼は医療知識のおかげで医者だと見なされた。",""],["915","判定を下す、批判的な意見を言う","pass judgment","It's easy to pass judgment without knowing the whole story.","全事情を知らずに批判的な意見を言うのは簡単だ。","L('25-2)"],["916","〜として通す、〜だと偽る","pass off as","The artist passed off a low-quality print as an original painting.","その芸術家は低品質のプリントを本物の絵画だと偽った。",""],["917","〜を無視する、見逃す、優遇しない","pass over","He was passed over for the promotion because of his lack of experience.","彼は経験不足のため、昇進を見逃された。",""],["918","Nを見送る[られる]","pass over for N","She was passed over for the promotion.","彼女は昇進の対象から外されました。","L('21-3)"],["919","責任を転嫁する","pass the buck","He always tries to pass the buck whenever there is a problem.","彼は問題があると、いつも責任を転嫁しようとする。",""],["920","〜を見逃す、放棄する、チャンスを逃す","pass up","I can't believe she passed up the opportunity to work abroad.","彼女が海外で働く機会を見逃したなんて信じられない。",""],["921","〜を修復する、仲直りする、手当てをする","patch up N","They patched up their differences after the argument.","彼らは議論の後、意見の違いを修復した。","語彙('25-3)"],["922","利益をもたらす、実を結ぶ","pay dividends","Hard work will eventually pay dividends in the long run.","努力は最終的に長期的に実を結ぶだろう。",""],["923","成果をもたらす、投資などが見合う成果を上げる","pay off","The company's investment in research and development eventually paid off.","その会社の研究開発への投資は最終的に実を結んだ。","長文(' ed to pin down the exact time for the meeting.","会議の正確な時間を特定する必要がある。",""],["940","責任の所在を突き止める","pin down blame","It was difficult to pin down blame for the accident.","その事故の責任の所在を突き止めるのは困難でした。","L('19-1)"],["941","〜を切望する、〜を恋しく思う","pine for","She has been pining for her childhood home ever since she moved away.","彼女は引っ越してからずっと故郷を恋しく思っている。","語彙('24-2)"],["942","静かにする、黙る","pipe down","The teacher asked the students to pipe down and listen carefully.","先生は生徒たちに静かにして、よく聞くように言った。","語彙('25-3)"],["943","〜の興味を引く、関心を持たせる","pique someone's interest","The book's intriguing cover art piqued my interest.","本の興味深い表紙が私の興味を引いた。",""],["944","協力する、手伝う","pitch in","Everyone pitched in to help with the cleanup after the event.","イベント後、みんなで掃除を手伝った。",""],["945","(人)にN（アイデアなど）を売り込む","pitch N to 人","She pitched her business idea to several investors.","彼女は数人の投資家に事業計画を売り込みました。","L('19-2)"],["946","呪いをかける","place curses","In ancient societies, people sometimes believed that enemies could place curses on them.","古代社会では、人々は敵が自分たちに呪いをかけられると信じることがあった。","長文('17-3)"],["947","〜に合わせる、同調する、演技する","play along","He decided to play along with the surprise party, pretending not to know about it.","彼はサプライズパーティーに合わせて、それについて知らないふりをすることに決めた。",""],["948","〜を軽視する、重要でないように扱う","play down","He tried to play down the importance of the issue to avoid conflict.","彼は対立を避けるためにその問題の重要性を軽視しようとした。",""],["949","うまく立ち回る、そつなくこなす","play his cards right","If he plays his cards right, he'll get promoted next year.","うまく立ち回れば、彼は来年昇進するでしょう。","L('19-3)"],["950","Nを助長する","play into N","Don't let your comments play into their strategy.","あなたの発言で相手の思うつぼにならないようにしてください。",""],["951","臨機応変にやる、その場の状況に合わせて行動する","play it by ear","We don't have a fixed schedule, so let's play it by ear.","決まった予定はないので、その場の状況に応じて行動しましょう。",""],["952","安全策をとる、慎重に運ぶ","play it safe","We decided to play it safe and postpone the launch.","私たちは安全策を取り、発売を延期することにしました。","L('21-2)"],["953","〜を利用する、競わせる、引き起こす","play off","The manager played off the two best candidates against each other.","マネージャーは二人の優れた候補者を競わせた。",""],["954","〜を利用する、感情を刺激する、〜に触れる","play on","The advertisement played on the viewers' emotions to increase sales.","その広告は視聴者の感情を刺激して販売を促進した。",""],["955","〜がうまくいく、良い結果を生む","play out (favorably)","The situation played out favorably for the team, and they won the championship.","状況はチームにとってうまくいき、彼らはチャンピオンになった。",""],["956","(副詞)のように(事態が)展開する","play out + adv.","It will be interesting to see how the negotiations play out.","交渉がどのように展開するのか興味深いです。",""],["957","〜に合わせて行動する、〜に対してアピールする","play to","The politician played to the crowd by promising more job opportunities.","政治家はより多くの雇用機会を約束して観衆にアピールした。",""],["958","罪を認める","plead guilty","He decided to plead guilty to avoid a longer sentence.","彼は長い刑を避けるために罪を認めることにした。",""],["959","～することを誓約する（確約する）","pledge to V","The government pledged to increase funding for public education.","政府は公教育への資金援助を増やすことを約束した。","長文('17-3)"],["960","（勇気など）を奮い起こす","pluck up N","She finally plucked up the courage to ask for a raise.","彼女はようやく昇給を頼む勇気を出した。","語彙('26-1)"],["961","〜を熱心に続ける、努力する","plug away at","She plugged away at her studies for hours, determined to pass the exam.","彼女は試験に合格するために何時間も勉強を続けた。",""],["962","～をコンセントに差し込む、組み込む","plug N in / plug N into N2","Don't forget to plug in your laptop before the battery runs out.","バッテリーが切れる前にノートパソコンを電源に差し込むのを忘れないでね。","語彙('25-3)"],["963","〜に飛び込む、没頭する","plunge into","He plunged into the project without any hesitation, eager to make progress.","彼は進展を楽しみにして、躊躇せずにそのプロジェクトに取り掛かった。",""],["964","〜を探し回る、うろうろする","poke around","The detective poked around the house for clues.","探偵は手がかりを探して家の中をうろうろした。",""],["965","〜を片付ける、食べ終わる、終わらせる","polish off N","He polished off the whole pizza in no time.","彼はあっという間にピザを食べ終わった。","語彙('26-1)"],["966","N(履歴書など)に磨きをかける（修正・改善する）","polish up N","I need to polish up my résumé before applying.","応募する前に履歴書を改善する必要があります。","L('21-3)/下位級"],["967","（お金を）支払う、払い出す","pony up (N)","Members were asked to pony up fifty dollars for the trip.","会員たちは旅行のために50ドルを支払うよう "work N out","I'm sure we can work this problem out together.","一緒ならこの問題を何とか解決できるはずです。","L('18-1)"],["1393","（問題などを）解決する、練り上げる","work out N","Governments must work out effective solutions to the housing crisis.","政府は住宅危機に対する効果的な解決策を練り上げなければならない。","L('17-2)"],["1394","（責任や約束などを）うまく逃れる、巧みに回避する","worm out of N","He tried to worm out of his promise.","彼は約束からうまく逃れようとした。","語彙('24-2)"],["1395","（仕事や会議などを）終える、まとめる、包む","wrap up","Let's wrap up the meeting.","会議を終わりにしましょう。","L('20-1)"],["1396","〜に甚大な被害をもたらす","wreak havoc on [with]","The new virus wreaked havoc on the healthcare system.","その新しいウイルスは医療システムに甚大な被害をもたらした。",""],["1397","～の支配権（主導権）をもぎ取る[力づくで奪う]","wrest control of ～","The rebel forces managed to wrest control of the capital from the government troops.","反政府勢力は政府軍から首都の支配権を奪取することに成功した。",""],["1398","うまく逃れる、責任を回避する","wriggle out of N","She always finds a way to wriggle out of trouble.","彼女はいつもトラブルをうまく回避する方法を見つける。","語彙('24-3)"],["1399","（情報・秘密などを）無理に聞き出す、搾り取る","wring out of","The police wrung a confession out of the suspect.","警察は容疑者から自白を無理やり引き出した。",""],["1400","（借金などを）帳消しにする、（損失を）諦める、（人を）見限る","write off","The company decided to write off the bad debt.","その会社は不良債権を帳消しにすることを決めた。",""],["1401","違反行為を文書に記録する, 違反を始末書・報告書にまとめる","write up violations","The manager had to write up two employees for violations of the safety policy.","マネージャーは、安全規則違反で2人の従業員を始末書にした[記録した]。",""],["1402","（損失として）帳消しにされた、（人が）見限られた","written off","He was written off as a failure.","彼は失敗者として見限られた。",""],["1403","〜に焦点を当てる、狙いを定める","zero in on","The scientists zeroed in on the cause of the disease.","科学者たちはその病気の原因に焦点を当てた。",""],["1404","迅速に通り過ぎる、あっという間に過ぎる","zip by","Time really zips by when you are having fun.","楽しんでいるときは時間が本当にあっという間に過ぎてしまう。","語彙('26-2)"],["1405","～のジッパーを閉める","zip up N / zip N up","Zip up your jacket before going outside into the cold.","寒い外に出る前にジャケットのジッパーを閉めなさい。","語彙('25-1)"]]},{"name":"前置詞句(0.4)","title":"英検１級前置詞句(ver.0.4)","head":["No","英語","訳","例文","例文の日本語訳","備考"],"rows":[["1","at best","よく見ても、せいぜい","At best, the policy will have only a limited impact on unemployment.","良くても、その政策が失業率に与える影響は限定的だろう。","長文('17-2)('19-3)"],["2","at first glance","一見したところ、パッと見たところ","At first glance, the proposal seems reasonable, but a closer examination reveals several serious flaws.","一見するとその提案は妥当に思えるが、詳しく調べるといくつかの重大な欠陥があることが分かる。","リスニング('23-3)"],["3","at one's disposal","（自分の意図で）自由に使える、利用できる","Researchers now have cutting-edge technology at their disposal to analyze massive amounts of genetic data.","研究者たちは現在、膨大な遺伝子データを解析するための最先端技術を自由に利用できる。","リスニング('24-3)"],["4","at one's own doorstep","すぐそばに、身近に","Many environmental problems begin right at our own doorstep.","多くの環境問題は私たちのすぐ身近なところから始まります。","リスニング('22-3)"],["5","at short notice","急に、急な知らせで","The committee had to arrange an emergency meeting at short notice after the unexpected resignation of its chairperson.","委員長の突然の辞任を受けて、委員会は急きょ緊急会議を開かなければならなかった。","リスニング('24-2)"],["6","at some point","将来のある時点で、いつか","I'd like to study abroad at some point in the future.","将来いつか留学したいと思っています。","リスニング('19-3)"],["7","at the expense of N","Nを犠牲にして","He achieved his career goals at the expense of his health and family time.","他の本業や私生活、健康などを犠牲にして、彼は自身のキャリアの目標を達成した。","長文('25-1)"],["8","at the forefront of","〜の最前線にいる、〜の先駆けである","The university is at the forefront of medical research.","その大学は医学研究の最前線にいます。","リスニング('20-1)"],["9","at the hands of N","Nのおかげで(+)、Nのせいで(-)","(+) The project achieved great success at the hands of a brilliant manager.\n(-) The small business suffered heavy losses at the hands of dishonest competitors.","(＋)そのプロジェクトは、優秀なマネージャーのおかげで大成功を収めた。\n(－)その小さな企業は、不誠実な競合他社のせいで大きな損失を被った。","長文('26-1)"],["10","at the mercy of N","〜のなすがままに、翻弄されて","Small island nations are increasingly at the mercy of extreme weather events caused by climate change.","小さな島国は、気候変動による異常気象にますます翻弄されている。","リスニング('24-2)"],["11","at the turn of the century","世紀の変わり目に（2000年前後に）","At the turn of the century, few people imagined how important smartphones would become.","世紀の変わり目には、スマートフォンがこれほど重要になるとはほとんどの人が想像していませんでした。","リスニング('20-2)"],["12","be entrusted with N","N（決定や任務など）を委ねられる、任される","The committee was entrusted with overseeing the implementation of the reform.","その委員会は改革の実施を監督する任務を任された。","長文('17-2)"],["13","down the road","将来、そのうち","We may move overseas down the road.","将来、海外に引っ越すかもしれません。","リスニング('19-2)('19-1)"],["14","for a bit","しばらくの間（よく否定文で）","I haven't seen him for a bit, but I'll contact him soon.","彼とはしばらく会っていませんが、近いうちに連絡します。",""],["15","from scratch","ゼロから、最初から","She built the business from scratch.","彼女はその会社をゼロから築き上げました。","リスニング('22-3)"],["16","in a bind","困った状況で、板挟みになって","I'm in a bind because two meetings are scheduled at the same time.","会議が二つ重なってしまい、とても困っています。","リスニング('21-2)"],["17","in a flash","あっという間に、すぐに","The children finished their lunch in a flash.","子どもたちはあっという間に昼食を食べ終えました。","リスニング('21-1)"],["18","in a given area of soil","特定の（ある一定の）範囲の土壌において","The number of microorganisms in a given area of soil can vary significantly depending on environmental conditions.","一定の土壌面積に存在する微生物の数は、環境条件によって大きく異なることがある。","長文('17-3)"],["19","in a similar vein","同様に","She criticized the policy for lacking transparency. In a similar vein, others questioned its accountability.","彼女はその政策が透明性に欠けると批判した。同様の趣旨で、他の人々はその説明責任を疑問視した。","長文('25-3)"],["20","in alignment","一致して、連動して","The new regulations are in alignment with international environmental standards.","その新しい規制は国際的な環境基準と一致している。","長文('17-2)"],["21","in between jobs","失業中、離職期間中で","I'm in between jobs at the moment, so I'm taking an online course.","今は仕事の合間なので、オンライン講座を受講しています。","リスニング('18-3)"],["22","in conjunction with N","Nと協力して、Nと共同で。","The local police department, in conjunction with the university, launched a safety campaign.","地元警察は大学と協力して、安全キャンペーンを開始した。","リスニング('26-1)"],["23","in contrast to N","Nとは対照的に","In contrast to previous generations, many young people prefer flexible work arrangements.","前の世代とは対照的に、多くの若者は柔軟な働き方を好む。","長文('17-3)"],["24","in control of","〜をコントロールしている、管理している","The military remained in control of the region for several years after the conflict.","軍はその紛争後も数年間その地域を支配していた。","長文('17-2)"],["25","in good faith","誠意を持って、善意で","We signed the agreement in good faith.","私たちは誠意を持ってその契約に署名しました。","リスニング('21-3)"],["26","in good working order","正常に作動して、整備されて","The equipment is in good working order.","その設備は正常に作動する状態だ。","リスニング('23-2)"],["27","in proportion to N","Nに比例して","Government spending on healthcare should increase in proportion to the aging population.","医療への政府支出は高齢化人口に比例して増加すべきである。","長文('17-3)"],["28","in proximity to","N～に近接(空間)して","Building residential areas in close proximity to industrial facilities may pose long-term health risks.","工業施設のすぐ近くに住宅地を建設することは、長期的な健康リスクをもたらす可能性がある。 ※「in close proximity to」","長文('22-1)"],["29","in the black","黒字で","The company has been in the black for three years.","その会社は3年間黒字を維持しています。","リスニング('22-1)"],["30","in the cards","起こりそうで、予定されて","We wanted to travel abroad this summer, but a trip is just not in the cards right now.","今年の夏は海外旅行に行きたかったのだが、今のところそういう予定にはなりそうにない（実現しそうにない）。","リスニング('25-3)('18-2)"],["31","in the driver's seat","主導権・支配権を握っている","She’s in the driver’s seat now that all her competitors have dropped out.","すべての競争相手が脱落した今、彼女が主導権を握っている。",""],["32","in the eyes of N","Nの目［視点］から見れば","In the eyes of many investors, transparency is essential for maintaining a company's credibility.","多くの投資家から見れば、透明性は企業の信頼性を維持するために不可欠である。","長文('22-1)"],["33","in the trade","同業者の間で、業界内で","That's a well-known saying in the trade.","それは業界ではよく知られた言い回しです。","リスニング('21-1)"],["34","in the way of","（否定文で）〜というほどのものは（ない）、〜といった形では（提供されない）。","The report didn't offer much in the way of practical solutions.","その報告書には、実用的な解決策と呼べるほどのものはあまり提示されていなかった。","リスニング('26-1)"],["35","of late","最近、近頃","Sales have improved of late.","最近、売り上げが伸びています。","リスニング('21-1)"],["36","off the top of my head","即座に（思い出す）","Off the top of my head, I'd say about twenty people attended.","ぱっと思いつく限りでは、20人くらいが参加したと思います。","リスニング('21-3)"],["37","on a 2669","contest","①(名)競技会、コンテスト ②(動)争う ③(動)異議を唱える","動詞は /kəntést/、名詞は /kɑ́ntest/"],["2678","contingent","①(形)偶発的な ②(形)(〜を)条件とする(contingent on) ③(名)派遣団、分遣隊","contingent upon 〜「〜次第の」"],["2732","converse","①(動)話す、会話する ②(形)逆の ③(名)逆、反対の事柄","動詞は /kənvə́ːrs/、形容詞・名詞は /kɑ́nvəːrs/。名詞の the converse「逆(の事柄)」"],["2740","convict","①(動)有罪を宣告する(convict A of B) ②(名)囚人、受刑者","動詞は /kənvíkt/、名詞は /kɑ́nvikt/"],["2840","course","①(名)進路、方向、経過 ②(名)講座、課程 ③(名)(料理の)一品 ④(名)(競技の)コース ⑤(動)(液体が)流れる","of course「もちろん」、in the course of 〜「〜の間に」、a matter of course「当然のこと」"],["2842","court","①(名)法廷、裁判所 ②(名)宮廷 ③(名)(テニスなどの)コート ④(動)求愛する ⑤(動)(危険などを)招く","court disaster「災難を招く」"],["2853","cover","①(動)覆う、(費用を)まかなう ②(動)報道する、取材する ③(動)(距離を)進む、(話題を)扱う ④(名)覆い、表紙 ⑤(名)保険の補償","cover for 〜「〜の代役をする」、cover up「隠ぺいする」"],["2868","crack","①(動)割れる、ひびが入る ②(動)(暗号を)解読する ③(動)(精神的に)参る ④(名)割れ目 ⑤(名)一撃 ⑥(形)(口語)すばらしい","crack down on 〜「〜を厳しく取り締まる」"],["2872","craft","①(名)技術、熟練した技 ②(名)手工芸 ③(名)船、飛行機 ④(動)手で作る、巧みに作り上げる","aircraft「航空機」の craft(複数形も craft)"],["2938","crop","①(名)作物、収穫 ②(名)(髪の)短髪、(乗馬用の)むち ③(動)刈り取る、(作物を)栽培する ④(動)(髪を)短く切る ⑤(動)(写真などを)切り取る","crop up「(予期せず)現れる」"],["2948","crown","①(名)王冠 ②(名)頂、頭頂 ③(名)歯冠 ④(動)王冠を授ける ⑤(動)(栄冠・成果を)与える","the crown「王室・王権」"],["2955","crude","①(形)粗野な、粗雑な ②(形)(加工していない)天然の ③(名)原油","crude oil「原油」、crude estimate「大まかな見積もり」"],["2985","cue","①(名)きっかけ、合図 ②(名)(ビリヤードの)キュー ③(動)合図する、きっかけを与える","on cue「ちょうどその時に」、take one's cue from 〜「〜を手本にする」"],["2986","cuff","①(名)(シャツの)袖口 ②(名)(米)ズボンの折り返し ③(名)手錠 ④(動)手錠をかける ⑤(動)(平手で)軽くたたく","off the cuff「即席で」"],["2989","cull","①(動)(群れから)選び出す ②(動)(動物を)間引く、淘汰する ③(動)(情報を)集める","cull から集める意味もあり、cull information from 〜「〜から情報を集める」"],["3009","curb","①(名)抑制、制限 ②(名)縁石 ③(動)抑える、制限する","curb inflation「インフレを抑える」"],["3076","dash","①(動)突進する、叩きつける ②(動)(望みなどを)打ち砕く ③(名)突進、ダッシュ ④(名)少量、ひとさじ ⑤(名)(記号の)ダッシュ","a dash of 〜「少量の〜」、dash someone's hopes「希望を打ち砕く」"],["3177","default","①(名)不履行、怠慢 ②(名)初期設定、既定値 ③(動)(義務を)怠る、債務不履行になる","by default「何もしないで/自動的に」、default on 〜「〜の支払いを怠る」"],["3188","defer","①(動)延期する、先延ばしにする ②(動)(意見に)従う(defer to)","defer to 〜「〜の意見に従う」"],["3197","defile","①(動)汚す、冒涜する ②(名)(山あいの)狭い道","defile は2種類あり、動詞「汚す」と名詞「狭い谷道」で別語源"]]}]</script>
<script>
const D=JSON.parse(document.getElementById("d").textContent);
let DONE={};try{DONE=JSON.parse(localStorage.getItem("eiken1-done")||"{}")}catch(e){}
var localUpd=Number((()=>{try{return localStorage.getItem("eiken1-upd")}catch(e){return 0}})())||0,pushT=null,remote=null;
const save=()=>{localUpd=Date.now();try{localStorage.setItem("eiken1-done",JSON.stringify(DONE));localStorage.setItem("eiken1-upd",String(localUpd))}catch(e){}pushRemote()};
const isDone=(n,no)=>!!(DONE[n]&&DONE[n][no]);
const PAGE=100;let cur=0,shown=PAGE,hits=[];
const $=id=>document.getElementById(id);
const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
$("sub").textContent=D.map(s=>s.name.replace(/\(.*\)/,"")+" "+s.rows.length.toLocaleString()).join("　");
D.forEach((s,i)=>{const b=document.createElement("button");b.role="tab";b.textContent=s.name;b.onclick=()=>{cur=i;$("q").value="";$("star").checked=false;render(true)};$("tabs").appendChild(b)});
function render(reset){
 if(reset)shown=PAGE;
 const s=D[cur],q=$("q").value.trim().toLowerCase(),starOnly=$("star").checked;
 [...$("tabs").children].forEach((b,i)=>b.setAttribute("aria-selected",i===cur));
 const hasStar=s.head.includes("優先");$("starL").hidden=!hasStar;
 const sd=$("showDone").checked;hits=s.rows.filter(r=>(sd||!isDone(s.name,r[0]))&&(!starOnly||r[2]==="★")&&(!q||r.some(c=>c.toLowerCase().includes(q))));
 $("th").innerHTML="<tr>"+s.head.map(h=>"<th>"+esc(h)+"</th>").join("")+"<th>覚えた</th></tr>";
 const hl=t=>{t=esc(t);if(!q)return t;const e=esc(q).replace(/[.*+?^${}()|[\]\\]/g,"\\$&");return t.replace(new RegExp(e,"gi"),m=>"<mark>"+m+"</mark>")};
 $("tb").innerHTML=hits.slice(0,shown).map(r=>"<tr>"+r.map((c,i)=>{const h=s.head[i];const cls=i===0?"no":h==="優先"?"star":(h.startsWith("英語")?"en":"");return '<td class="'+cls+'">'+hl(c)+"</td>"}).join("")+'<td class="chk"><input type="checkbox" aria-label="覚えた" data-no="'+esc(r[0])+'"'+(isDone(s.name,r[0])?" checked":"")+"></td></tr>").join("");
 const dn=Object.keys(DONE[s.name]||{}).length;$("cnt").textContent=hits.length.toLocaleString()+" 件(覚えた "+dn+")";
 $("empty").hidden=hits.length>0;$("more").hidden=hits.length<=shown;
}
$("tb").addEventListener("change",e=>{const t=e.target;if(!t.dataset.no)return;const n=D[cur].name;DONE[n]=DONE[n]||{};if(t.checked)DONE[n][t.dataset.no]=1;else delete DONE[n][t.dataset.no];save();if(!$("showDone").checked){const tr=t.closest("tr");setTimeout(()=>{render(false)},250)}else render(false)});
$("showDone").onchange=()=>render(true);
$("q").oninput=()=>render(true);$("star").onchange=()=>render(true);
$("more").onclick=()=>{shown+=PAGE;render(false)};

function enc(o){const out={};for(const k in o){const n=Object.keys(o[k]).map(Number).filter(x=>!isNaN(x)).sort((a,b)=>a-b);if(!n.length)continue;const r=[];let st=n[0],pv=st;for(let i=1;i<=n.length;i++){const v=n[i];if(v===pv+1){pv=v;continue}r.push(st===pv?""+st:st+"-"+pv);st=v;pv=v}out[k]=r.join(",")}return "EK1:"+btoa(unescape(encodeURIComponent(JSON.stringify(out))))}
function dec(c){c=c.replace(/\s/g,"");if(!c.startsWith("EK1:"))throw 0;const o=JSON.parse(decodeURIComponent(escape(atob(c.slice(4)))));const d={};for(const k in o){d[k]={};o[k].split(",").forEach(t=>{if(!t)return;const m=t.split("-").map(Number);const e=m.length>1?m[1]:m[0];for(let i=m[0];i<=e;i++)d[k][i]=1})}return d}
function setStatus(t){$("sync").textContent=t}
function pushRemote(){if(!remote)return;clearTimeout(pushT);setStatus("保存中…");pushT=setTimeout(async()=>{try{await remote.set({code:enc(DONE),updated:localUpd});setStatus("同期済み "+new Date().toTimeString().slice(0,5))}catch(e){setStatus("同期に失敗(この端末には保存済み)")}},800)}
function adopt(code,upd){try{DONE=dec(code);localUpd=upd;localStorage.setItem("eiken1-done",JSON.stringify(DONE));localStorage.setItem("eiken1-upd",String(upd))}catch(e){}render(false)}
(async()=>{try{if(!window.claude||!claude.use)return;const [dbm,um,dl]=await Promise.all([claude.use("db"),claude.use("user"),claude.use("downloads")]);if(dl){$("sv").hidden=false;$("sv").onclick=async()=>{try{await dl.save({filename:"eiken1-memorized.txt",data:enc(DONE)})}catch(e){}}}
if(!dbm||!um)return;const id=await um.id();if(!id)return;remote=dbm.doc("data/users/"+id+"/done");setStatus("アカウントと同期中");
const snap=await remote.get();const d=snap.exists?snap.data():null;
if(d&&d.code&&(d.updated||0)>localUpd)adopt(d.code,d.updated);else if(Object.keys(DONE).length)pushRemote();
remote.onSnapshot(sn=>{const x=sn.exists&&sn.data();if(x&&x.code&&(x.updated||0)>localUpd&&!sn.metadata.hasPendingWrites)adopt(x.code,x.updated)},()=>{})}catch(e){}})();
$("bk").onclick=()=>{$("code").value=enc(DONE);$("msg").textContent="";$("inp").value="";$("dlg").showModal()};
$("cl").onclick=()=>$("dlg").close();
$("cp").onclick=async()=>{const t=$("code");t.select();try{await navigator.clipboard.writeText(t.value)}catch(e){try{document.execCommand("copy")}catch(e2){}}$("msg").textContent="コピーしました。コピーできない場合は、上の文字列を長押しして手動でコピーしてください。"};
function imp(replace){try{const d=dec($("inp").value);if(replace)DONE=d;else for(const k in d){DONE[k]=Object.assign(DONE[k]||{},d[k])}save();render(true);$("msg").textContent="取り込みました。"}catch(e){$("msg").textContent="コードを読み取れませんでした。「EK1:」から始まる文字列を全部貼り付けてください。"}}
$("mg").onclick=()=>imp(false);$("rp").onclick=()=>imp(true);
render(true);
</script></body></html>
